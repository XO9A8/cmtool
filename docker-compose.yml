version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cmtool-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: efootball_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/20260731000000_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d efootball_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmtool-backend-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/efootball_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENABLE_AI_INSIGHTS: "true"
      RUST_LOG: "info,cmtool_backend=debug"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
